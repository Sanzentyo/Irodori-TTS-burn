[package]
name = "irodori-tts-burn"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Sanzentyo"]
description = "Irodori-TTS inference with production-connected fused WGSL kernels"
autobins = false

[lib]
name = "irodori_tts_burn"

[workspace]
members = ["crates/wgslpack"]
exclude = ["experiments/fusion-provider"]
resolver = "3"

# --------------------------------------------------------------------------
# Feature flags
# --------------------------------------------------------------------------
[features]
default = ["inference", "codec", "text-normalization"]

# Library subsystems — gate modules and their specific dependencies
inference          = [] # InferenceBuilder / InferenceEngine type-state API
codec              = [ "dep:cubek-convolution"] # DACVAE encoder/decoder
streaming-graphs   = ["codec"] # Opt-in bounded decoder graph reuse
text-normalization = ["dep:regex", "dep:unicode-normalization", "dep:once_cell"]  # Japanese text normaliser
audio-io           = ["dep:hound"] # WAV, reference loudness and band-limited resampling
lora               = []                                                       # LoRA adapter loading/merging (additive to inference)

# Binary tooling — pulls in deps only needed by CLI executables, not library consumers
cli = ["dep:clap", "dep:anyhow", "dep:hf-hub", "audio-io", "dep:tokenizers", "dep:tracing-subscriber"]

# Enable NVTX range annotations for nsys profiling.
profile = ["dep:nvtx", "dep:cubecl-wgpu"]

# Native driver compilation cache; shares the existing CubeCL environment.
native-pipeline-cache = ["dep:cubecl-wgpu", "cubecl-wgpu/native-pipeline-cache"]

# Experimental generated-shader persistence, independently selectable from the
# native driver cache. Requires a SPIR-V-capable WGPU compiler/backend.
spirv-cache = ["dep:cubecl-wgpu", "cubecl-wgpu/persistence"]

# Opt in to CubeCL's SPIR-V compiler explicitly on macOS. Linux and the other
# non-macOS native targets retain the existing SPIR-V-enabled default through
# the target dependency below. Enabling this on macOS requires LunarG's Vulkan
# SDK and its `VULKAN_SDK` environment variable.
vulkan-spirv = ["cubecl/wgpu-spirv"]

# Fusion providers are isolated in experiments/fusion-provider: Burn 0.22's
# fusion feature replaces the dispatch backend even when enabled transitively.
synthesis = ["inference", "codec", "text-normalization", "audio-io", "dep:tokenizers"]
worker = ["synthesis", "dep:base64"]
http-server = ["synthesis", "dep:tiny_http"]
packed-weights = ["dep:wgslpack"]
packed-export = ["packed-weights", "dep:tempfile"]

# --------------------------------------------------------------------------
# Dependencies
# --------------------------------------------------------------------------
[dependencies]
# Always needed (core model, weights, WGPU backend, serialization).
#
# Keep the Burn dispatch enum single-backend: do not add `cpu`, `cuda`,
# `flex`, `ndarray`, `tch`, `vulkan`, or `webgpu` here.  `wgpu` is the
# cross-platform AutoCompiler route used by production; the lower-level
# CubeCL dependency below is constrained to the same runtime family.  Its
# `wgpu-spirv` feature adds a compiler used by WGPU's AutoCompiler on Vulkan;
# it does not add Burn's separate `vulkan` dispatch backend. It remains the
# non-macOS default, while macOS only enables it through `vulkan-spirv` so a
# normal Metal build does not require the Vulkan SDK.
# `extension` exposes Burn's low-level `backend::wgpu` bridge used by the
# production custom-WGSL launchers; it does not enable another backend.
burn = { version = "=0.22.0", default-features = false, features = ["std", "wgpu", "autotune", "template", "extension"] }
burn-store = { version = "=0.22.0", default-features = false, features = ["std", "safetensors"] }
half = "2.7.1"
safetensors = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"

# Conditional — activated by library subsystem features
once_cell = { version = "1.21.4", optional = true }
regex = { version = "1.12.3", optional = true }
tokenizers = { version = "0.23.2", optional = true }
unicode-normalization = { version = "0.1.25", optional = true }

# Conditional — activated by `cli` feature (binary-only deps)
anyhow = { version = "1.0.102", optional = true }
clap = { version = "4.6.0", features = ["derive"], optional = true }
hf-hub = { version = "0.5.0", optional = true }
hound = { version = "3.5.1", optional = true }
sha2 = "0.10.9"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], optional = true }

# Conditional — profiling
nvtx = { version = "1.3.0", optional = true }
cubecl-wgpu = { version = "=0.11.0", default-features = false, features = ["std"], optional = true }
burn-backend = { version = "=0.22.0", default-features = false, features = ["std"] }
cubek-convolution = { version = "=0.3.0", default-features = false, features = ["std"], optional = true }
cubek-matmul = { version = "=0.3.0", default-features = false, features = ["multi-level", "std"] }
cubek-std = { version = "=0.3.0", default-features = false, features = ["std"] }
cubecl = { version = "=0.11.0", default-features = false, features = ["std", "stdlib", "template", "wgpu"] }
burn-cubecl = { version = "=0.22.0", default-features = false, features = ["std"] }
bytemuck = "1.25.0"
tiny_http = { version = "0.12.0", default-features = false, optional = true }
base64 = { version = "0.23.1", optional = true }
wgslpack = { version = "0.1.0", path = "crates/wgslpack", optional = true }
tempfile = { version = "3.27.0", optional = true }
cubecl-environment = { version = "=0.11.0", default-features = false, features = ["std"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Preserve the existing SPIR-V AutoCompiler path on Linux/Windows without
# imposing CubeCL's macOS-only VULKAN_SDK build guard on Metal users.
cubecl = { version = "=0.11.0", default-features = false, features = ["wgpu-spirv"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"
toml = "1.1.2"

[patch.crates-io]
# CubeK 0.3 does not expose runtime data to its global output writer.  The
# local patch adds the generic epilogue boundary used by the codec's fused
# k=7 convolution + Snake path; keep both crates together so their internal
# CubeK contracts cannot drift independently.
cubek-convolution = { path = "vendor/cubek-convolution" }
cubek-matmul = { path = "vendor/cubek-matmul" }
cubecl-wgpu = { path = "vendor/cubecl-wgpu" }

# --------------------------------------------------------------------------
# Benchmarks
# --------------------------------------------------------------------------
[[bench]]
name = "inference"
harness = false
required-features = ["inference"]

[[bench]]
name = "codec"
harness = false
required-features = ["codec"]

# --------------------------------------------------------------------------
# Binary targets (autobins = false — every binary is explicit)
# --------------------------------------------------------------------------
[[example]]
name = "bench_v4_duration"
path = "examples/bench_v4_duration.rs"
required-features = ["cli", "inference"]

[[bin]]
name = "pack_codec"
path = "src/bin/pack_codec.rs"
required-features = ["cli", "codec", "packed-export"]

[[bin]]
name = "pack_checkpoint"
path = "src/bin/pack_checkpoint.rs"
required-features = ["cli", "packed-export"]

[[bin]]
name = "bench_checkpoint_load"
path = "src/bin/bench_checkpoint_load.rs"
required-features = ["cli", "packed-weights"]

[[bin]]
name = "irodori"
path = "src/bin/irodori.rs"
required-features = ["cli", "synthesis"]

[[bin]]
name = "validate_synthesis"
path = "src/bin/validate_synthesis.rs"
required-features = ["cli", "synthesis"]

[[bin]]
name = "pipeline"
path = "src/bin/pipeline.rs"
required-features = ["inference", "codec", "text-normalization", "cli"]

[[bin]]
name = "compare_audio"
path = "src/bin/compare_audio.rs"
required-features = ["cli"]

[[bin]]
name = "validate_v4_precision"
path = "src/bin/validate_v4_precision.rs"
required-features = ["inference", "codec", "cli"]

[[bin]]
name = "profile_codec_decoder"
path = "src/bin/profile_codec_decoder.rs"
required-features = ["codec", "cli", "profile"]

[[bin]]
name = "probe_wgpu_adapter"
path = "src/bin/probe_wgpu_adapter.rs"
required-features = ["cli"]

[[bin]]
name = "bench_v4_residency"
path = "src/bin/bench_v4_residency.rs"
required-features = ["inference", "codec", "cli"]

[[bin]]
name = "diagnose_v4_forward"
path = "src/bin/diagnose_v4_forward.rs"
required-features = ["inference", "cli"]

[[bin]]
name = "approve_v4_autotune"
path = "src/bin/approve_v4_autotune.rs"
required-features = ["inference", "codec", "cli"]

[[bin]]
name = "tune_v4_routes"
path = "src/bin/tune_v4_routes.rs"
required-features = ["inference", "codec", "cli", "profile"]

[[bin]]
name = "bench_v4_dense_routes"
path = "src/bin/bench_v4_dense_routes.rs"
required-features = ["inference", "cli"]

[[bin]]
name = "bench_v4_softmax"
path = "src/bin/bench_v4_softmax.rs"
required-features = ["inference", "cli"]
